<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'"><title>Quota Glass · 设置</title><link rel="stylesheet" href="settings.css"></head>
<body><main><header><h1>额度与连接</h1><button id="refresh">刷新额度</button></header><p class="intro">环形数字为剩余百分比，倒计时为额度重置时间。</p><section id="connections" aria-label="服务商连接"></section>
<section class="preferences"><h2>悬浮面板</h2><label class="setting"><span>始终置顶</span><input type="checkbox" id="top"></label><label class="setting"><span>开机启动</span><input type="checkbox" id="startup" aria-describedby="startup-note"></label><p id="startup-note" class="source" role="status">登录 Windows 后自动显示面板</p><label class="setting"><span>面板大小</span><span class="scale-control"><input type="range" id="scale" min="0.6" max="1.4" step="0.01" value="0.8" aria-label="面板大小" aria-describedby="scale-value"><output id="scale-value" for="scale">80%</output></span></label></section>
<p class="help">拖动面板空白处可移动位置。<kbd>Ctrl</kbd> + <kbd>Shift</kbd> + <kbd>Q</kbd> 显示或收起；也可双击托盘图标找回面板。每 60 秒自动刷新。</p><p class="privacy">只查询额度，不调用模型或消耗重置次数。登录信息由原客户端管理，面板不保存密钥。</p><p id="status" role="status"></p></main><script src="shared.js"></script><script src="settings.js"></script></body></html>
