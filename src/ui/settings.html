<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'"><title>Quota Glass · 设置</title><link rel="stylesheet" href="settings.css"></head>
<body><main><header><h1>额度与连接</h1><button id="refresh">刷新额度</button></header><p class="intro">环形数字为剩余百分比，倒计时为额度重置时间；OpenAI API 显示美元余额。</p><section id="connections" aria-label="服务商连接"></section>
<section class="preferences"><h2>悬浮面板</h2><label class="setting"><span>始终置顶</span><input type="checkbox" id="top"></label><label class="setting"><span>开机启动</span><input type="checkbox" id="startup" aria-describedby="startup-note"></label><p id="startup-note" class="source" role="status">登录 Windows 后自动显示面板</p><label class="setting"><span>面板大小</span><span class="scale-control"><input type="range" id="scale" min="0.6" max="1.4" step="any" value="0.8" aria-label="面板大小" aria-describedby="scale-value"><output id="scale-value" for="scale">80%</output></span></label><label class="setting"><span>玻璃透明度</span><span class="scale-control"><input type="range" id="transparency" min="0.2" max="0.9" step="any" value="0.55" aria-label="玻璃透明度" aria-describedby="transparency-note"><output id="transparency-value" for="transparency">55%</output></span></label><p id="transparency-note" class="source">数值越高越通透，文字与圆环保持清晰。</p></section>
<section class="preferences"><h2>扩展</h2><label class="setting"><span>显示 Clash Verge 节点延迟</span><input type="checkbox" id="clash-ping" aria-describedby="clash-note clash-status"></label><p id="clash-note" class="source">在更新时间右侧显示 ping，随额度刷新测速。规则模式跟随默认策略组，全局模式跟随全局选择。</p><p id="clash-status" class="source" role="status">未开启</p></section>
<p class="help">拖动面板空白处移动，拖动边缘调整大小。<kbd>Ctrl</kbd> + <kbd>Shift</kbd> + <kbd>Q</kbd> 显示或收起；也可双击托盘图标找回面板。每 60 秒自动刷新。</p><p class="privacy">只查询额度，不调用模型或消耗重置次数。订阅登录由原客户端管理；主动连接的 OpenAI 网页会话加密保存在本机。</p><p id="status" role="status"></p></main><script src="shared.js"></script><script src="settings.js"></script></body></html>
